[package]
name = "trytocatchme"
version = "0.1.0"
description = "Cross-platform VPN/proxy client (Tauri + sing-box)"
authors = ["TryToCatchMe"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "trytocatchme_lib"
# Desktop MVP links the lib statically into the binary (rlib). The staticlib/cdylib
# crate-types are only needed for mobile (Android/iOS) and trip a GNU-ld export-table
# bug ("export ordinal too large") on Windows; re-add them when adding mobile targets.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
parking_lot = "0.12"
ttcm-core = { path = "ttcm-core" }
tokio = { version = "1", features = ["time", "rt", "net"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
is_elevated = "0.1"

[workspace]
members = ["ttcm-core"]

[features]
# by default Tauri runs in production mode; custom-protocol is used by the bundler.
custom-protocol = ["tauri/custom-protocol"]
