name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the release once up front so the build jobs don't race to create it.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "TryToCatchMe ${{ github.ref_name }}"
          body: |
            Downloads:
            - Windows: **TryToCatchMe_..._x64-setup.exe** — installer (bundles the sing-box core + Wintun).
            - Windows: **TryToCatchMe_..._x64-AllInOne.zip** — no installer: the exe with the core, used by the All in One launcher.
            - Linux: **TryToCatchMe_..._amd64.AppImage** — portable (`chmod +x` and run).
          draft: false
          prerelease: false

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch sing-box core (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/fetch-core.ps1

      - name: Fetch sing-box core (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: bash ./scripts/fetch-core.sh

      - name: Build and upload (Windows)
        if: matrix.os == 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TryToCatchMe ${{ github.ref_name }}"
          args: --bundles ${{ matrix.bundles }}

      # Zip for the All in One launcher (unpacked into modules/TryToCatchMe): the exe with the core next to it
      # in the installer's layout, so the resource lookup finds binaries\sing-box.exe.
      - name: All in One zip (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $dir = "portable"
          New-Item -ItemType Directory -Force "$dir/binaries" | Out-Null
          Copy-Item src-tauri/target/release/trytocatchme.exe "$dir/TryToCatchMe.exe"
          Copy-Item src-tauri/binaries/sing-box.exe, src-tauri/binaries/wintun.dll "$dir/binaries/"
          Compress-Archive -Path "$dir/*" -DestinationPath "TryToCatchMe_${version}_x64-AllInOne.zip"

      - name: Upload All in One zip (Windows)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: TryToCatchMe_*_x64-AllInOne.zip

      # Linux: build only, then strip host-only libs from the AppImage before uploading.
      - name: Build (Linux)
        if: matrix.os == 'ubuntu-22.04'
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles ${{ matrix.bundles }}

      - name: Fix AppImage (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
            bash ./scripts/fix-appimage.sh "$f"
          done

      - name: Upload (Linux)
        if: matrix.os == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/release/bundle/appimage/*.AppImage
